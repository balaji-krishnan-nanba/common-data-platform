# Development environment configuration

azure:
  storage_account: ${AZURE_STORAGE_ACCOUNT_DEV}
  key_vault_url: ${AZURE_KEY_VAULT_URL_DEV}
  secret_scope: kv-main

spark:
  max_workers: 2
  node_type: Standard_DS3_v2
  spark_version: "13.3.x-scala2.12"
  
data_quality:
  fail_on_error: false  # More lenient in dev
  max_error_threshold: 10
  enable_profiling: true

logging:
  level: DEBUG
  structured: true
  
file_tracking:
  method: database
  tracking_table: ${project_code}-${environment}-bronze.system.processed_files

retry_policy:
  max_attempts: 2
  backoff_seconds: 30