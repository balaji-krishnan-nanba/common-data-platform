# Production environment configuration

azure:
  storage_account: ${AZURE_STORAGE_ACCOUNT_PROD}
  key_vault_url: ${AZURE_KEY_VAULT_URL_PROD}
  tenant_id: ${AZURE_TENANT_ID}
  secret_scope: kv-main

spark:
  max_workers: 8
  node_type: Standard_DS4_v2
  spark_version: "13.3.x-scala2.12"
  
data_quality:
  fail_on_error: true
  max_error_threshold: 0
  enable_profiling: false

logging:
  level: INFO
  structured: true
  
file_tracking:
  method: database
  tracking_table: ${project_code}-${environment}-bronze.system.processed_files

retry_policy:
  max_attempts: 3
  backoff_seconds: 120