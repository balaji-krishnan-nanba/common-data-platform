# CSV file source configurations

product_catalog_csv:
  name: product_catalog_csv
  type: csv
  
  connection:
    storage_account: ${var.azure_storage_account}
    container: raw-data
    path_pattern: catalog/products/{year}/{month}/products_*.csv
    file_pattern: "products_*.csv"
    secret_scope: kv-main
    service_principal:
      client_id_key: azure-client-id
      client_secret_key: azure-client-secret
      tenant_id: ${var.azure_tenant_id}
    
  schema:
    strict_validation: true
    columns:
      - name: product_id
        type: string
        nullable: false
      - name: product_name
        type: string
        nullable: false
        constraints:
          max_length: 255
      - name: category
        type: string
        nullable: false
      - name: subcategory
        type: string
        nullable: true
      - name: brand
        type: string
        nullable: true
      - name: unit_price
        type: decimal(10,2)
        nullable: false
        constraints:
          min: 0
      - name: cost_price
        type: decimal(10,2)
        nullable: false
        constraints:
          min: 0
      - name: supplier_id
        type: string
        nullable: true
      - name: is_active
        type: boolean
        nullable: false
        default: true
      - name: created_date
        type: date
        format: yyyy-MM-dd
        nullable: false
      - name: last_updated
        type: timestamp
        format: yyyy-MM-dd HH:mm:ss
        nullable: false
        
  read_options:
    header: true
    delimiter: ","
    quote: "\""
    escape: "\\"
    encoding: "UTF-8"
    multiline: true
    
  ingestion:
    mode: incremental
    partition_by: created_date
    
  target:
    catalog: ${project_code}-${environment}-bronze
    schema: csv_data
    table: product_catalog
    partition_columns: ["created_date"]
    
  file_tracking:
    method: database
    tracking_table: ${project_code}-${environment}-bronze.system.processed_files

inventory_movements_csv:
  name: inventory_movements_csv
  type: csv
  
  connection:
    storage_account: ${var.azure_storage_account}
    container: raw-data
    path_pattern: inventory/movements/{year}/{month}/{day}/movements_*.csv
    file_pattern: "movements_*.csv"
    secret_scope: kv-main
    service_principal:
      client_id_key: azure-client-id
      client_secret_key: azure-client-secret
      tenant_id: ${var.azure_tenant_id}
    
  schema:
    strict_validation: true
    columns:
      - name: movement_id
        type: string
        nullable: false
      - name: product_id
        type: string
        nullable: false
      - name: warehouse_id
        type: string
        nullable: false
      - name: movement_type
        type: string
        nullable: false
        constraints:
          allowed_values: ["IN", "OUT", "TRANSFER", "ADJUSTMENT"]
      - name: quantity
        type: integer
        nullable: false
      - name: unit_cost
        type: decimal(10,2)
        nullable: true
        constraints:
          min: 0
      - name: movement_date
        type: timestamp
        format: yyyy-MM-dd HH:mm:ss
        nullable: false
      - name: reference_number
        type: string
        nullable: true
      - name: notes
        type: string
        nullable: true
        
  read_options:
    header: true
    delimiter: ","
    quote: "\""
    escape: "\\"
    encoding: "UTF-8"
    
  ingestion:
    mode: incremental
    partition_by: movement_date
    
  target:
    catalog: ${project_code}-${environment}-bronze
    schema: csv_data
    table: inventory_movements
    partition_columns: ["movement_date"]
    
  file_tracking:
    method: database
    tracking_table: ${project_code}-${environment}-bronze.system.processed_files