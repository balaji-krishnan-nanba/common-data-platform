# Oracle database source configurations

oracle_erp_system:
  name: oracle_erp_system
  type: oracle
  
  connection:
    host: oracle-server.company.com
    port: 1521
    service_name: PROD
    secret_scope: kv-main
    username_key: oracle_username
    password_key: oracle_password
  
  tables:
    - name: customers
      source_schema: SALES
      source_table: CUSTOMERS
      target_schema: oracle_data
      target_table: customers
      incremental:
        enabled: true
        key_column: LAST_MODIFIED_DATE
        watermark_table: ${project_code}-${environment}-bronze.system.watermarks
      
    - name: orders
      source_schema: SALES
      source_table: ORDERS
      target_schema: oracle_data
      target_table: orders
      incremental:
        enabled: true
        key_column: ORDER_DATE
        
    - name: order_items
      source_schema: SALES
      source_table: ORDER_ITEMS
      target_schema: oracle_data
      target_table: order_items
      incremental:
        enabled: true
        key_column: CREATED_DATE
        
    - name: products
      source_schema: INVENTORY
      source_table: PRODUCTS
      target_schema: oracle_data
      target_table: products
      incremental:
        enabled: false  # Full refresh for master data
        
    - name: inventory
      source_schema: INVENTORY
      source_table: STOCK_LEVELS
      target_schema: oracle_data
      target_table: inventory
      incremental:
        enabled: true
        key_column: LAST_UPDATED
        
    - name: suppliers
      source_schema: PROCUREMENT
      source_table: SUPPLIERS
      target_schema: oracle_data
      target_table: suppliers
      incremental:
        enabled: false  # Full refresh for master data
        
    - name: warehouses
      source_schema: LOGISTICS
      source_table: WAREHOUSES
      target_schema: oracle_data
      target_table: warehouses
      incremental:
        enabled: false  # Full refresh for master data

  target:
    catalog: ${project_code}-${environment}-bronze
    
  batch_size: 100000
  
  jdbc_options:
    fetchsize: 10000
    numPartitions: 4