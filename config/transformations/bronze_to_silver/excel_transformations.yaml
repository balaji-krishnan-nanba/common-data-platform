# Excel data transformations from bronze to silver

daily_sales_cleansing:
  source:
    catalog: ${project_code}-${environment}-bronze
    schema: excel_data
    table: daily_sales
    
  target:
    catalog: ${project_code}-${environment}-silver
    schema: excel_data
    table: sales_cleansed
    
  engine: sparksql
  sql_file: sql/bronze_to_silver/excel_sales_cleansing.sql
  
  transformations:
    - type: data_quality_checks
      checks:
        - type: null_check
          columns: [transaction_id, customer_id, product_code]
          threshold: 0
        - type: duplicate_check
          columns: [transaction_id]
          threshold: 0
        - type: range_check
          column: total_amount
          min: 0
          
    - type: standardization
      rules:
        payment_method:
          - from: ["CC", "CREDIT CARD", "Credit Card"]
            to: "Credit Card"
          - from: ["DC", "DEBIT CARD", "Debit Card"]
            to: "Debit Card"
          - from: ["CASH", "Cash", "cash"]
            to: "Cash"
        store_location:
          - from: ["NY", "New York", "NYC"]
            to: "New York"
          - from: ["LA", "Los Angeles", "L.A."]
            to: "Los Angeles"
            
    - type: derived_columns
      columns:
        - name: transaction_year
          expression: "YEAR(transaction_date)"
        - name: transaction_month
          expression: "MONTH(transaction_date)"
        - name: transaction_quarter
          expression: "QUARTER(transaction_date)"
        - name: revenue_category
          expression: |
            CASE 
              WHEN total_amount >= 1000 THEN 'High Value'
              WHEN total_amount >= 100 THEN 'Medium Value'
              ELSE 'Low Value'
            END
        - name: discount_amount
          expression: "(unit_price * quantity) - total_amount"
          
  write_mode: overwrite
  partition_by: [transaction_year, transaction_month]

customer_master_scd2:
  source:
    catalog: ${project_code}-${environment}-bronze
    schema: excel_data
    table: customer_master
    
  target:
    catalog: ${project_code}-${environment}-silver
    schema: excel_data
    table: dim_customers_scd2
    
  change_data_capture:
    type: scd_type_2
    business_keys:
      - customer_id
    tracked_columns:
      - customer_name
      - email
      - phone
      - address
      - city
      - state
      - zip_code
      - customer_segment
      - is_active
    update_only_columns: []
    scd_columns:
      valid_from: valid_from_date
      valid_to: valid_to_date
      is_current: is_current_flag
      version: record_version
      hash: record_hash
      
  transformations:
    - type: data_quality_checks
      checks:
        - type: null_check
          columns: [customer_id, customer_name]
          threshold: 0
        - type: duplicate_check
          columns: [customer_id]
          threshold: 0
          
    - type: standardization
      rules:
        customer_name:
          - trim: true
          - upper_case: true
        email:
          - lower_case: true
          - trim: true
        phone:
          - regex_replace:
              pattern: "[^0-9]"
              replacement: ""