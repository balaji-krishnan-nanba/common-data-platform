# Silver to Gold layer transformations for analytics
# These transformations create business-ready datasets optimized for reporting and analytics

customer_analytics:
  name: customer_analytics
  type: aggregation
  
  source:
    catalog: ${project_code}-${environment}-silver
    schema: excel_data
    table: customer_master
    
  target:
    catalog: ${project_code}-${environment}-gold
    schema: analytics
    table: customer_analytics
    
  transformation:
    type: sql
    sql_file: customer_analytics.sql
    
  schedule:
    frequency: daily
    time: "08:00"
    
  dependencies:
    - silver_layer.customer_cleansing

sales_summary:
  name: sales_summary
  type: aggregation
  
  source:
    catalog: ${project_code}-${environment}-silver
    schema: excel_data
    table: daily_sales
    
  target:
    catalog: ${project_code}-${environment}-gold
    schema: analytics
    table: sales_summary
    
  transformation:
    type: sql
    sql_file: sales_summary.sql
    
  partitioning:
    columns: ["year", "month"]
    
  optimization:
    enable_z_order: true
    z_order_columns: ["customer_id", "product_code"]
    
  schedule:
    frequency: daily
    time: "08:30"
    
  dependencies:
    - silver_layer.sales_cleansing

inventory_analytics:
  name: inventory_analytics
  type: aggregation
  
  sources:
    - catalog: ${project_code}-${environment}-silver
      schema: csv_data
      table: product_catalog
    - catalog: ${project_code}-${environment}-silver
      schema: csv_data
      table: inventory_movements
    - catalog: ${project_code}-${environment}-silver
      schema: oracle_data
      table: inventory
      
  target:
    catalog: ${project_code}-${environment}-gold
    schema: analytics
    table: inventory_analytics
    
  transformation:
    type: sql
    sql_file: inventory_analytics.sql
    
  schedule:
    frequency: daily
    time: "09:00"
    
  data_quality:
    checks:
      - type: row_count
        threshold_min: 100
      - type: freshness
        max_hours: 25
        
  dependencies:
    - silver_layer.product_cleansing
    - silver_layer.inventory_cleansing