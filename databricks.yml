# This is a Databricks asset bundle definition for common-data-platform.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: common-data-platform

variables:
  project_code: cddp  # 4-letter project code

resources:
  jobs:
    oracle_ingestion_pipeline:
      name: "Oracle Data Ingestion Pipeline"
      
      tasks:
        - task_key: ingest_oracle_to_bronze
          job_cluster_key: ingestion_cluster
          python_wheel_task:
            package_name: common_data_platform
            entry_point: run_bronze_ingestion
            parameters: ["--source", "oracle_erp_system"]
          
        - task_key: transform_to_silver
          depends_on:
            - task_key: ingest_oracle_to_bronze
          job_cluster_key: transformation_cluster
          python_wheel_task:
            package_name: common_data_platform
            entry_point: run_silver_transformation
            parameters: ["--source", "oracle_erp_system"]
        
        - task_key: transform_to_gold
          depends_on:
            - task_key: transform_to_silver
          job_cluster_key: transformation_cluster
          python_wheel_task:
            package_name: common_data_platform
            entry_point: run_gold_transformation
            parameters: ["--source", "oracle_analytics"]
      
      job_clusters:
        - job_cluster_key: ingestion_cluster
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 2
            
        - job_cluster_key: transformation_cluster
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "Standard_DS4_v2"
            num_workers: 4
      
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"  # Daily at 6 AM
        timezone_id: "UTC"
        
      email_notifications:
        on_failure:
          - data-team@company.com

    excel_ingestion_pipeline:
      name: "Excel File Ingestion Pipeline"
      
      tasks:
        - task_key: ingest_excel_to_bronze
          job_cluster_key: file_ingestion_cluster
          python_wheel_task:
            package_name: common_data_platform
            entry_point: run_bronze_ingestion
            parameters: ["--source", "daily_sales_excel"]
          
        - task_key: transform_excel_to_silver
          depends_on:
            - task_key: ingest_excel_to_bronze
          job_cluster_key: file_ingestion_cluster
          python_wheel_task:
            package_name: common_data_platform
            entry_point: run_silver_transformation
            parameters: ["--source", "daily_sales_excel"]
      
      job_clusters:
        - job_cluster_key: file_ingestion_cluster
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 2
      
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"  # Daily at 7 AM
        timezone_id: "UTC"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-2908121449961741.1.azuredatabricks.net
    variables:
      environment: dev
      
  test:
    mode: staging
    workspace:
      host: ${DATABRICKS_HOST_TEST}
    variables:
      environment: test
      
  prod:
    mode: production
    workspace:
      host: ${DATABRICKS_HOST_PROD}
    variables:
      environment: prod
