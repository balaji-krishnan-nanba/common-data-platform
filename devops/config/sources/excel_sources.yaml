# Excel file source configurations

daily_sales_excel:
  name: daily_sales_excel
  type: excel
  
  connection:
    storage_account: ${var.azure_storage_account}
    container: raw-data
    path_pattern: sales/daily/{year}/{month}/{day}/sales_*.xlsx
    file_pattern: "sales_*.xlsx"
    secret_scope: ${var.azure_key_vault_scope}
    service_principal:
      client_id_key: azure-client-id
      client_secret_key: azure-client-secret
      tenant_id: ${var.azure_tenant_id}
    
  schema:
    strict_validation: true
    columns:
      - name: transaction_id
        type: string
        nullable: false
      - name: transaction_date
        type: date
        format: yyyy-MM-dd
        nullable: false
      - name: customer_id
        type: string
        nullable: false
      - name: product_code
        type: string
        nullable: false
      - name: quantity
        type: integer
        nullable: false
        constraints:
          min: 1
      - name: unit_price
        type: decimal(10,2)
        nullable: false
        constraints:
          min: 0
      - name: total_amount
        type: decimal(10,2)
        nullable: false
        constraints:
          min: 0
      - name: payment_method
        type: string
        nullable: true
      - name: store_location
        type: string
        nullable: true
        
  read_options:
    header: true
    sheet_name: "Sales Data"
    treat_empty_values_as_nulls: true
    
  ingestion:
    mode: incremental
    partition_by: transaction_date
    
  target:
    catalog: ${project_code}-${environment}-bronze
    schema: excel_data
    table: daily_sales
    partition_columns: ["transaction_date"]
    
  file_tracking:
    method: database
    tracking_table: ${project_code}-${environment}-bronze.system.processed_files