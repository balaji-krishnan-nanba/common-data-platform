# Ingestion cluster configuration
# Used for data ingestion from various sources (Oracle, Excel, etc.)
# Note: This defines reusable cluster configurations for job clusters

resources:
  clusters:
    ingestion_cluster:
      cluster_name: "ingestion-cluster-${var.environment}"
      spark_version: ${var.spark_version}
      node_type_id: ${var.ingestion_node_type}
      num_workers: ${var.ingestion_workers}
      autotermination_minutes: 30
      spark_env_vars:
        PROJECT_CODE: ${var.project_code}
        ENVIRONMENT: ${var.environment}
        AZURE_TENANT_ID: ${var.azure_tenant_id}
        AZURE_STORAGE_ACCOUNT: ${var.azure_storage_account}
        AZURE_KEY_VAULT_URL: ${var.azure_key_vault_url}
      custom_tags:
        project: ${var.project_code}
        environment: ${var.environment}
        cost_center: data_platform
        cluster_type: ingestion
      enable_elastic_disk: true
      data_security_mode: SINGLE_USER