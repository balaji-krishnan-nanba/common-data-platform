# Excel File Ingestion Pipeline Job
# Handles ingestion from Excel files through bronze -> silver layers

resources:
  jobs:
    excel_ingestion_pipeline:
      name: "Excel File Ingestion Pipeline"
      timeout_seconds: 3600
      max_concurrent_runs: 1
      tags:
        project: ${var.project_code}
        environment: ${var.environment}
      
      tasks:
        - task_key: ingest_excel_to_bronze
          job_cluster_key: file_ingestion_cluster
          python_wheel_task:
            package_name: ${var.package_name}
            entry_point: run_bronze_ingestion
            parameters: ["--source", "daily_sales_excel"]
          
        - task_key: transform_excel_to_silver
          depends_on:
            - task_key: ingest_excel_to_bronze
          job_cluster_key: file_ingestion_cluster
          python_wheel_task:
            package_name: ${var.package_name}
            entry_point: run_silver_transformation
            parameters: ["--source", "daily_sales_excel"]
      
      job_clusters:
        - job_cluster_key: file_ingestion_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.ingestion_node_type}
            num_workers: 0  # Single-node configuration
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*]"
            spark_env_vars:
              PROJECT_CODE: ${var.project_code}
              ENVIRONMENT: ${var.environment}
              AZURE_TENANT_ID: ${var.azure_tenant_id}
              AZURE_STORAGE_ACCOUNT: ${var.azure_storage_account}
              AZURE_KEY_VAULT_URL: ${var.azure_key_vault_url}
            custom_tags:
              project: ${var.project_code}
              environment: ${var.environment}
              cost_center: data_platform
              ResourceClass: SingleNode
              cluster_type: job_file_ingestion_single_node
              workload_type: file_processing
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            libraries:
              - whl: ../../../artifacts/common_data_platform  # Bundle artifact
      
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"  # Daily at 7 AM
        timezone_id: "UTC"