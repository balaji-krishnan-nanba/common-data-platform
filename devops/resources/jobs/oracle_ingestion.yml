# Oracle Data Ingestion Pipeline Job
# Handles ingestion from Oracle ERP system through bronze -> silver -> gold layers

resources:
  jobs:
    oracle_ingestion_pipeline:
      name: "Oracle Data Ingestion Pipeline"
      timeout_seconds: 3600
      max_concurrent_runs: 1
      tags:
        project: ${var.project_code}
        environment: ${var.environment}
      
      tasks:
        - task_key: ingest_oracle_to_bronze
          job_cluster_key: ingestion_cluster
          python_wheel_task:
            package_name: ${var.package_name}
            entry_point: run_bronze_ingestion
            parameters: ["--source", "oracle_erp_system"]
          
        - task_key: transform_to_silver
          depends_on:
            - task_key: ingest_oracle_to_bronze
          job_cluster_key: transformation_cluster
          python_wheel_task:
            package_name: ${var.package_name}
            entry_point: run_silver_transformation
            parameters: ["--source", "oracle_erp_system"]
        
        - task_key: transform_to_gold
          depends_on:
            - task_key: transform_to_silver
          job_cluster_key: transformation_cluster
          python_wheel_task:
            package_name: ${var.package_name}
            entry_point: run_gold_transformation
            parameters: ["--source", "oracle_analytics"]
      
      job_clusters:
        - job_cluster_key: ingestion_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.ingestion_node_type}
            num_workers: 0  # Single-node configuration
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*]"
            spark_env_vars:
              PROJECT_CODE: ${var.project_code}
              ENVIRONMENT: ${var.environment}
              AZURE_TENANT_ID: ${var.azure_tenant_id}
              AZURE_STORAGE_ACCOUNT: ${var.azure_storage_account}
              AZURE_KEY_VAULT_URL: ${var.azure_key_vault_url}
            custom_tags:
              project: ${var.project_code}
              environment: ${var.environment}
              cost_center: data_platform
              ResourceClass: SingleNode
              cluster_type: job_ingestion_single_node
              workload_type: file_ingestion
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            
        - job_cluster_key: transformation_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.transformation_node_type}
            num_workers: 0  # Single-node configuration
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*]"
            spark_env_vars:
              PROJECT_CODE: ${var.project_code}
              ENVIRONMENT: ${var.environment}
              AZURE_TENANT_ID: ${var.azure_tenant_id}
              AZURE_STORAGE_ACCOUNT: ${var.azure_storage_account}
              AZURE_KEY_VAULT_URL: ${var.azure_key_vault_url}
            custom_tags:
              project: ${var.project_code}
              environment: ${var.environment}
              cost_center: data_platform
              ResourceClass: SingleNode
              cluster_type: job_transformation_single_node
              workload_type: data_transformation
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
      
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"  # Daily at 6 AM
        timezone_id: "UTC"