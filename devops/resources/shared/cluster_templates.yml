# Shared cluster configuration templates
# Eliminates duplication across job definitions using YAML anchors

# Base single-node cluster configuration (common across all cluster types)
base_single_node_cluster: &base_single_node_cluster
  spark_version: ${var.spark_version}
  num_workers: 0  # Single-node configuration
  
  # Single-node Spark configuration
  spark_conf:
    "spark.databricks.cluster.profile": "singleNode"
    "spark.master": "local[*]"
  
  # Common environment variables for all clusters
  spark_env_vars:
    PROJECT_CODE: ${var.project_code}
    ENVIRONMENT: ${var.environment}
    AZURE_TENANT_ID: ${var.azure_tenant_id}
    AZURE_STORAGE_ACCOUNT: ${var.azure_storage_account}
    AZURE_KEY_VAULT_URL: ${var.azure_key_vault_url}
  
  # Common cluster settings
  enable_elastic_disk: false  # Not needed for single-node
  data_security_mode: SINGLE_USER
  
  # Base custom tags (extended by specific cluster types)
  custom_tags:
    project: ${var.project_code}
    environment: ${var.environment}
    cost_center: data_platform
    ResourceClass: SingleNode

# Ingestion cluster template (for file processing workloads)
ingestion_cluster_template: &ingestion_cluster_template
  <<: *base_single_node_cluster
  node_type_id: ${var.ingestion_node_type}  # Standard_DS3_v2
  custom_tags:
    <<: *base_single_node_cluster.custom_tags
    cluster_type: job_ingestion_single_node
    workload_type: file_ingestion

# Transformation cluster template (for data processing workloads)
transformation_cluster_template: &transformation_cluster_template
  <<: *base_single_node_cluster
  node_type_id: ${var.transformation_node_type}  # Standard_DS3_v2
  custom_tags:
    <<: *base_single_node_cluster.custom_tags
    cluster_type: job_transformation_single_node
    workload_type: data_transformation

# File-specific ingestion cluster (Excel, CSV, etc.)
file_ingestion_cluster_template: &file_ingestion_cluster_template
  <<: *base_single_node_cluster
  node_type_id: ${var.ingestion_node_type}  # Standard_DS3_v2
  custom_tags:
    <<: *base_single_node_cluster.custom_tags
    cluster_type: job_file_ingestion_single_node
    workload_type: file_processing

# Interactive cluster template (for notebooks and ad-hoc analysis)
interactive_cluster_template: &interactive_cluster_template
  <<: *base_single_node_cluster
  node_type_id: ${var.interactive_node_type}  # Standard_DS3_v2
  data_security_mode: USER_ISOLATION  # Unity Catalog requirement for interactive
  custom_tags:
    <<: *base_single_node_cluster.custom_tags
    cluster_type: interactive_single_node
    workload_type: interactive_analysis

# Common job metadata template
base_job_metadata: &base_job_metadata
  timeout_seconds: 3600
  max_concurrent_runs: 1
  email_notifications:
    on_failure: ${var.notification_emails}
  tags:
    project: ${var.project_code}
    environment: ${var.environment}

# Python wheel task template
python_wheel_task_template: &python_wheel_task_template
  python_wheel_task:
    package_name: ${var.package_name}