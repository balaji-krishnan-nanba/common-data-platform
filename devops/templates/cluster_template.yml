# Reusable cluster template with common configuration
cluster_template: &cluster_template
  spark_version: ${var.spark_version}
  spark_env_vars:
    PROJECT_CODE: ${var.project_code}
    ENVIRONMENT: ${var.environment}
    AZURE_TENANT_ID: ${var.azure_tenant_id}
    AZURE_STORAGE_ACCOUNT: ${var.azure_storage_account}
    AZURE_KEY_VAULT_URL: ${var.azure_key_vault_url}
  custom_tags:
    project: ${var.project_code}
    environment: ${var.environment}
    cost_center: data_platform
  enable_elastic_disk: true
  data_security_mode: SINGLE_USER

# Specific cluster configurations
ingestion_cluster_template: &ingestion_cluster
  <<: *cluster_template
  node_type_id: ${var.ingestion_node_type}
  
transformation_cluster_template: &transformation_cluster
  <<: *cluster_template
  node_type_id: ${var.transformation_node_type}