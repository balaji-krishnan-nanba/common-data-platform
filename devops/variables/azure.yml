# Azure-specific variable definitions
variables:
  # Storage account variables (environment-specific)
  azure_storage_account_dev:
    default: ${AZURE_STORAGE_ACCOUNT_DEV}
    description: "Azure Storage Account for development environment"
  
  azure_storage_account_test:
    default: ${AZURE_STORAGE_ACCOUNT_TEST}
    description: "Azure Storage Account for test environment"
  
  azure_storage_account_prod:
    default: ${AZURE_STORAGE_ACCOUNT_PROD}
    description: "Azure Storage Account for production environment"
  
  # Key Vault variables (environment-specific)
  azure_key_vault_url_dev:
    default: ${AZURE_KEY_VAULT_URL_DEV}
    description: "Azure Key Vault URL for development environment"
  
  azure_key_vault_url_test:
    default: ${AZURE_KEY_VAULT_URL_TEST}
    description: "Azure Key Vault URL for test environment"
  
  azure_key_vault_url_prod:
    default: ${AZURE_KEY_VAULT_URL_PROD}
    description: "Azure Key Vault URL for production environment"
  
  # Key Vault secret scope names
  azure_key_vault_scope_dev:
    default: ${AZURE_KEY_VAULT_SCOPE_DEV}
    description: "Databricks secret scope name for development Key Vault"
  
  azure_key_vault_scope_test:
    default: ${AZURE_KEY_VAULT_SCOPE_TEST}
    description: "Databricks secret scope name for test Key Vault"
  
  azure_key_vault_scope_prod:
    default: ${AZURE_KEY_VAULT_SCOPE_PROD}
    description: "Databricks secret scope name for production Key Vault"
  
  # Environment-specific storage account (computed)
  azure_storage_account:
    description: "Azure Storage Account for current environment (computed from environment-specific variables)"
  
  azure_key_vault_scope:
    description: "Azure Key Vault scope for current environment (computed from environment-specific variables)"
  
  # Databricks workspace URLs (environment-specific)
  databricks_host_dev:
    default: ${DATABRICKS_HOST_DEV}
    description: "Databricks workspace URL for development"
  
  databricks_host_test:
    default: ${DATABRICKS_HOST_TEST}
    description: "Databricks workspace URL for test environment"
  
  databricks_host_prod:
    default: ${DATABRICKS_HOST_PROD}
    description: "Databricks workspace URL for production environment"