[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "common-data-platform"
version = "1.0.0"
description = "Modular Data Ingestion Framework for Azure Databricks Lakehouse"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Data Engineering Team", email = "data-engineering@company.com"}
]
keywords = ["databricks", "azure", "data-engineering", "etl", "data-pipeline", "lakehouse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core Spark and Delta dependencies (DBR 16.4 compatible)
    "pyspark>=3.4.0,<4.0.0",  # Compatible with DBR 16.4 (PySpark 3.5.x)
    "delta-spark>=2.4.0,<4.0.0",  # Compatible with DBR 16.4 (Delta 3.x)
    
    # Configuration and data handling
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    
    # Azure integrations
    "azure-storage-blob>=12.0.0",
    "azure-identity>=1.12.0",
    "azure-keyvault-secrets>=4.7.0",
    
    # Scientific computing (explicit constraints for Python 3.12 compatibility)
    "numpy>=1.26.2,<2.0.0",
    "scipy>=1.10.0,<2.0.0",  # Updated for Python 3.12 support
    
    # Excel file support
    "openpyxl>=3.1.0",
    
    # CLI and utilities
    "click>=8.0.0",
    "python-dateutil>=2.8.0",
    "requests>=2.28.0",
    
    # Logging and monitoring
    "structlog>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
databricks = [
    "databricks-cli>=0.17.0",
    "databricks-sdk>=0.12.0",
]
quality = [
    "great-expectations>=0.17.0,<0.19.0",
]
oracle = [
    # Oracle JDBC driver support for PySpark
    # Note: Requires ojdbc8.jar to be available in Spark classpath
    "jaydebeapi>=1.2.3",
    "JPype1>=1.4.0",
]

[project.scripts]
cdp-provision = "scripts.provision_infrastructure:main"
cdp = "src.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
common_data_platform = ["**/*.yaml", "**/*.yml", "**/*.sql", "**/*.md"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# mypy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Note: Test suite can be added later as needed