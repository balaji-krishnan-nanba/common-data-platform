[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "common-data-platform"
version = "1.0.0"
description = "Modular Data Ingestion Framework for Azure Databricks Lakehouse"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Data Engineering Team", email = "data-engineering@company.com"}
]
keywords = ["databricks", "azure", "data-engineering", "etl", "data-pipeline", "lakehouse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pyspark>=3.4.0",
    "delta-spark>=2.4.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "azure-storage-blob>=12.0.0",
    "azure-identity>=1.12.0",
    "azure-keyvault-secrets>=4.7.0",
    "click>=8.0.0",
    "python-dateutil>=2.8.0",
    "requests>=2.28.0",
    "openpyxl>=3.1.0",
    "numpy>=1.26.2,<2.0.0",
    "scipy>=1.9.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
databricks = [
    "databricks-cli>=0.17.0",
    "databricks-sdk>=0.12.0",
]
quality = [
    "great-expectations>=0.17.0,<0.19.0",
]

[project.scripts]
cdp-provision = "scripts.provision_infrastructure:main"
run_bronze_ingestion = "src.cli:run_bronze_ingestion"
run_silver_transformation = "src.cli:run_silver_transformation"
run_gold_transformation = "src.cli:run_gold_transformation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.sql", "*.md"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# mypy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]